spring.application.name=bank-system
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_CONNECTIONSTRING:jdbc:postgresql://localhost:5432/bank_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database migrations run before Hibernate validates the mapped schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep Thymeleaf templates and static assets fresh during local UI development.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
