<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - ReBank</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main class="page">
    <section class="panel">
        <h1>Create account</h1>
        <p th:if="${error}" class="error" th:text="${error}">Error</p>

        <form th:action="@{/register}" method="post">
            <label>
                Username
                <input name="username" type="text" autocomplete="username" th:value="${username}" required>
            </label>
            <label>
                Email
                <input name="email" type="email" autocomplete="email" th:value="${email}" required>
            </label>
            <label>
                Password
                <input name="password" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <label>
                Confirm password
                <input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button type="submit">Register</button>
        </form>

        <p class="switch">Already registered? <a th:href="@{/login}">Login</a></p>
    </section>
</main>
</body>
</html>
