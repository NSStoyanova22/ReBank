<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send Money - ReBank</title>
    <link rel="stylesheet" th:href="@{/styles.css?v=2}">
</head>
<body>
<main class="page dashboard-page">
    <div class="dashboard-shell">
        <header class="dashboard-header">
            <a class="brand" th:href="@{/}" aria-label="ReBank home"><span class="brand-mark">R</span>Re<span>Bank</span></a>
            <div class="menu-wrap">
                <button class="menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-menu">
                    <span></span><span></span><span></span>
                </button>
                <nav id="main-menu" class="menu-panel" aria-label="Main navigation" hidden>
                    <p class="menu-heading">ReBank menu</p>
                    <a class="menu-link" th:href="@{/}">
                        <span class="menu-link-icon" aria-hidden="true">⌂</span>
                        <span>Dashboard</span>
                    </a>
                    <a class="menu-link active" th:href="@{/send-money}">
                        <span class="menu-link-icon" aria-hidden="true">↗</span>
                        <span>Send money</span>
                    </a>
                    <form th:action="@{/logout}" method="post">
                        <button class="menu-link logout-link" type="submit">
                            <span class="menu-link-icon" aria-hidden="true">↪</span>
                            <span>Log out</span>
                        </button>
                    </form>
                </nav>
            </div>
        </header>

        <section class="send-money-page" aria-labelledby="send-money-title">
            <h1 id="send-money-title">Send money</h1>
        </section>
    </div>
</main>
<script>
    const menuButton = document.querySelector('.menu-button');
    const menuPanel = document.querySelector('#main-menu');

    menuButton.addEventListener('click', () => {
        const isOpen = !menuPanel.hasAttribute('hidden');
        menuPanel.toggleAttribute('hidden', isOpen);
        menuButton.setAttribute('aria-expanded', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
        if (!menuPanel.hasAttribute('hidden') && !event.target.closest('.menu-wrap')) {
            menuPanel.setAttribute('hidden', '');
            menuButton.setAttribute('aria-expanded', 'false');
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !menuPanel.hasAttribute('hidden')) {
            menuPanel.setAttribute('hidden', '');
            menuButton.setAttribute('aria-expanded', 'false');
            menuButton.focus();
        }
    });

</script>
</body>
</html>
